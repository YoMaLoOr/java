<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label, select, input{
            display: block;
        }
    </style>
    <script>
        function calcular(){
            let num1 = Number(document.getElementById('v1').value);
            let num2 = Number(document.getElementById('v2').value);
            let op = document.getElementById('operador').value;
            let resul;

            switch(op){
                case "+":
                    resul = num1 + num2;
                    break;
                case "-":
                    resul = num1 - num2;
                    break;
                case "*":
                    resul = num1 * num2;
                    break;
                case "/":
                    resul = num1 / num2;
                    break;
            }
            document.getElementById('resultado').textContent = `El resultado es ${resul}.`;

        }
        window.onload = function(){
            document.getElementById('btnCalcular').onclick = calcular;
        };
    </script>
</head>
<body>
    <div id="contPrincipal">
        <h1>Super calculadora</h1>
        <label for="v1">Valor 1</label>
        <input type="number" id="v1" name="v1">
        <label for="operador">Operador</label>
        <select name="operador" id="operador">
            <option value="+">Suma</option>
            <option value="-">Resta</option>
            <option value="*">Producto</option>
            <option value="/">Division</option>
        </select>
        <label for="v2">Valor 2</label>
        <input type="number" id="v2" name="v2">
        <button id="btnCalcular">Calcular</button>
        <p id="resultado">El resultado se mostará aqui.</p>
    </div>
</body>
</html>
